services:
  mongodb:
    image: mongo:7
    container_name: paisamind-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=paisamind
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: paisamind-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/paisamind
      - CLIENT_URL=http://localhost:3000
      - SWEEP_TOKEN=local-dev-sweep-token-not-production
    depends_on:
      mongodb:
        condition: service_healthy

  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: paisamind-seed
    restart: "no"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/paisamind
    command: ["node", "scripts/generateDemoData.js"]
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: paisamind-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
